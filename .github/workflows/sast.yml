name: Análisis SAST con CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  codeql:
    name: Análisis CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Inicializar CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'javascript' # Cambia esto si usas python, java, etc.

    - name: Ejecutar análisis CodeQL
      uses: github/codeql-action/analyze@v3
      with:
        output: results
        upload: false # En el PDF figura como false para subirlo como artefacto manual

    - name: Guardar reporte SARIF como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: codeql-results
        path: results/javascript.sarif