name: Análisis Dinámico (DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Iniciar la aplicación y esperar
        run: |
          npm run build --if-present
          # Iniciamos el servidor en background
          npm start &
          # Esperamos explícitamente a la IP 127.0.0.1
          echo "Esperando a que inicie el servidor..."
          npx wait-on http://127.0.0.1:3000 -t 60000

      - name: Verificar conexión (Debug)
        run: |
          echo "Probando conexión con curl..."
          curl -v http://127.0.0.1:3000

      - name: Escaneo ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://127.0.0.1:3000' # Usamos IP explícita
          fail_action: false
          allow_issue_writing: false
          # IMPORTANTE: -r obliga a crear el reporte con este nombre
          cmd_options: '-a -r zap_report.html' 

      - name: Guardar resultados ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: zap_report.html