name: Análisis Dinámico (DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Iniciar la aplicación y esperar
        run: |
          npm run build --if-present
          # Iniciamos el servidor
          npm start &
          # Esperamos a que el puerto 3000 responda
          echo "Esperando conexión..."
          npx wait-on http://127.0.0.1:3000 -t 60000

      # --- CORRECCIÓN CRÍTICA PARA EL ERROR 254 ---
      - name: Dar permisos de escritura al workspace
        run: chmod -R 777 .
      # --------------------------------------------

      - name: Escaneo ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true # Permite que el pipeline siga aunque encuentre fallos
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://127.0.0.1:3000'
          fail_action: false
          allow_issue_writing: false
          # -a: incluye reglas alfa/beta
          # -r: obliga a guardar el reporte con este nombre específico
          cmd_options: '-a -r zap_report.html'

      - name: Guardar resultados ZAP
        if: always() # Se ejecuta aunque ZAP detecte vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: zap_report.html