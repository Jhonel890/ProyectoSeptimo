name: Análisis Dinámico (DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast:
    name: Escaneo OWASP ZAP (Docker Root)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Iniciar la aplicación y esperar
        # Importante: Definimos las variables de entorno que aparecen en tu PDF (Fig. 9)
        env:
          PORT: 3000
        run: |
          # Iniciamos la app en background
          npm run build --if-present
          npm start &
          
          # Esperamos a que el puerto 3000 responda
          echo "Esperando a que la aplicación inicie..."
          npx wait-on http://localhost:3000 -t 60000

      - name: Verificar conexión (Debug)
        # Este paso nos dirá si la app está viva antes de culpar a ZAP
        run: |
          echo "Probando conexión a la app..."
          curl -v http://localhost:3000

      - name: Descargar imagen ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Ejecutar Escaneo ZAP (Como Root)
        run: |
          # Explicación de los cambios para arreglar tu error:
          # -u 0: Ejecuta como ROOT para tener permiso de escritura (Soluciona "No files found")
          # --network host: Permite ver "localhost:3000" (Soluciona error de conexión)
          # -v ${{ github.workspace }}:/zap/wrk/:rw : Mapea la carpeta correctamente
          
          docker run --rm --network host -u 0 -v ${{ github.workspace }}:/zap/wrk/:rw \
          ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
          -t http://localhost:3000 -r zap_report.html -I

      - name: Guardar resultados ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: zap_report.html