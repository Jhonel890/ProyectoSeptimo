name: Análisis Dinámico (DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast:
    name: Escaneo OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Iniciar la aplicación y esperar
        run: |
          # Damos permisos totales a la carpeta para evitar error de escritura
          sudo chmod -R 777 .
          
          # Iniciamos la app en segundo plano
          npm run build --if-present
          npm start &
          
          # Esperamos a que el puerto 3000 esté activo en el localhost del runner
          echo "Esperando a que la aplicación inicie..."
          npx wait-on http://127.0.0.1:3000 -t 60000

      - name: Escaneo ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # TRUCO: Usamos 172.17.0.1 para acceder al host desde Docker en Linux
          target: 'http://172.17.0.1:3000'
          fail_action: false
          allow_issue_writing: false
          # Forzamos el nombre del reporte para encontrarlo después
          cmd_options: '-a -r zap_report.html'

      - name: Guardar resultados ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: zap_report.html