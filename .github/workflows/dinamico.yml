name: Análisis Dinámico (DAST)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast:
    name: Escaneo OWASP ZAP (Manual Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Iniciar la aplicación y esperar
        run: |
          # Damos permisos totales para evitar problemas de escritura del reporte
          sudo chmod -R 777 .
          
          # Iniciamos la app
          npm run build --if-present
          npm start &
          
          # Esperamos al puerto 3000
          echo "Esperando a que la aplicación inicie..."
          npx wait-on http://localhost:3000 -t 60000

      - name: Descargar imagen de ZAP
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Ejecutar Escaneo ZAP Directo
        run: |
          # Ejecutamos Docker directamente
          # -v $(pwd):/zap/wrk/:rw  -> Mapea la carpeta actual para guardar el reporte
          # --network host          -> PERMITE que ZAP vea 'localhost:3000' directamente
          # -t ... zap-baseline.py  -> Ejecuta el script de escaneo
          
          docker run -v $(pwd):/zap/wrk/:rw \
          --network host \
          -t ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py -t http://localhost:3000 -r zap_report.html -I

      - name: Guardar resultados ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap_report
          path: zap_report.html